<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zastave sveta</title>
<link rel="stylesheet" href="common.css">
<style>
  .wrap{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:14px}
  h1{margin:0;font-size:clamp(30px,6vw,48px);text-align:center}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);text-align:center;font-size:18px;margin:0}
  .conts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
  .cont{
    appearance:none;border:3px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;
    border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:92px;
    border-left:10px solid var(--c,#fff);transition:transform .1s,background .15s;
  }
  .cont:hover{background:rgba(255,255,255,.2)}
  .cont:active{transform:scale(.97)}
  .cont b{font-size:clamp(20px,3.2vw,26px)}
  .cont small{color:var(--muted);font-size:16px}
  .cont.world{grid-column:1/-1;--c:#ffd24a}
  .qflag{width:min(86vw,360px);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.85);background:#dfe7f5;line-height:0}
  .qflag svg,.opt svg{width:100%;height:auto;display:block}
  .prompt{font-size:clamp(22px,3.8vw,32px);font-weight:800;text-align:center;margin:0}
  .prompt b{color:var(--accent)}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
  .opt{
    appearance:none;border:3px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:800;
    font-size:clamp(20px,3.4vw,26px);min-height:74px;border-radius:20px;cursor:pointer;padding:12px;
    transition:transform .1s,background .15s,border-color .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  }
  .opt:hover:not(:disabled){background:rgba(255,255,255,.22)}
  .opt:active:not(:disabled){transform:scale(.97)}
  .opt:focus-visible{outline:5px solid #fff;outline-offset:3px;box-shadow:0 0 0 9px rgba(255,210,74,.55)}
  .opt.flagopt{padding:8px;min-height:0}
  .opt.flagopt .fl{width:100%;border-radius:10px;overflow:hidden;line-height:0;border:2px solid rgba(255,255,255,.7)}
  .opt .cap{font-size:17px;display:none}
  .opts.done .opt .cap{display:block}
  .opt.bad{background:rgba(255,100,100,.28);border-color:#ff8a8a;opacity:.55}
  .opt.good{background:rgba(95,224,138,.35);border-color:var(--ok);opacity:1}
  .opt.gone{visibility:hidden}
  .opt .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:-1px}
  .dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.4)}
  .dots i.cur{border-color:#fff;background:rgba(255,255,255,.55)}
  .dots i.ok{background:var(--ok);border-color:var(--ok)}
  .dots i.miss{background:var(--accent);border-color:var(--accent)}
  .fb{width:100%;background:rgba(255,255,255,.12);border:2px solid var(--line);border-radius:20px;padding:14px 18px;text-align:center;font-size:clamp(18px,2.8vw,22px);line-height:1.4}
  .fb[hidden]{display:none}
  .fb .big{font-size:clamp(22px,3.4vw,28px);font-weight:800;display:block;margin-bottom:4px}
  .fb .fact{color:#dff0ff}
  .fb .fact::before{content:"Znaš li? ";font-weight:800;color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .stars{font-size:64px;letter-spacing:8px;color:var(--accent);text-shadow:0 4px 0 rgba(0,0,0,.25)}
  .stars .off{color:rgba(255,255,255,.25)}
  .newflags{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%}
  .nf{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:14px;text-align:center}
  .nf .fl{width:100%;border-radius:8px;overflow:hidden;line-height:0;border:2px solid rgba(255,255,255,.7)}
  .album-sec{width:100%}
  .album-sec h2{margin:10px 0 8px;font-size:22px;border-left:10px solid var(--c);padding-left:10px;display:flex;justify-content:space-between}
  .album-sec h2 small{color:var(--muted);font-weight:700;font-size:16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .tile{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:14px;font-weight:700;cursor:pointer;text-align:center}
  .tile .fl{width:100%;border-radius:8px;overflow:hidden;line-height:0}
  .tile.locked{cursor:default;opacity:.65}
  .tile.locked .q{width:100%;aspect-ratio:3/2;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:rgba(255,255,255,.55)}
  .tile:focus-visible{outline:5px solid #fff;outline-offset:3px}
  .bigflag{width:min(80vw,320px);margin:0 auto;border-radius:12px;overflow:hidden;line-height:0;border:3px solid rgba(255,255,255,.85)}
  [hidden]{display:none!important}
  @media (max-width:520px){.conts{grid-template-columns:1fr}.opts{gap:10px}}
</style>
</head>
<body>
<header class="top">
  <a class="btn" href="index.html" id="backLink">‹ Nazad</a>
  <div class="brand">ZASTAVE SVETA</div>
  <div class="grow"></div>
  <button class="btn round" id="snd" type="button">🔊</button>
</header>

<main class="page">
  <!-- Početni ekran -->
  <section class="wrap" id="start">
    <h1>Zastave <span>sveta</span></h1>
    <p class="sub">Pogodi zastavu, saznaj nešto zanimljivo i skupi ceo album!</p>
    <div class="conts" id="conts"></div>
    <button class="btn" id="albumBtn" type="button">📒 Moj album zastava</button>
  </section>

  <!-- Pitanje -->
  <section class="wrap" id="play" hidden>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <p class="prompt" id="prompt"></p>
    <div class="qflag" id="qflag" hidden></div>
    <div class="opts" id="opts"></div>
    <div class="row"><button class="btn" id="helpBtn" type="button">💡 Pomoć</button></div>
    <div class="fb" id="fb" hidden aria-live="polite"></div>
    <button class="btn primary" id="nextBtn" type="button" hidden>Dalje ›</button>
  </section>

  <!-- Rezultat -->
  <section class="wrap" id="result" hidden>
    <h1 id="resTitle">Bravo!</h1>
    <div class="stars" id="resStars" aria-hidden="true"></div>
    <p class="sub" id="resText"></p>
    <div class="newflags" id="newFlags"></div>
    <div class="row">
      <button class="btn primary" id="againBtn" type="button">Igraj ponovo</button>
      <button class="btn" id="menuBtn" type="button">Izbor kontinenta</button>
      <button class="btn" id="albumBtn2" type="button">📒 Album</button>
    </div>
  </section>

  <!-- Album -->
  <section class="wrap" id="album" hidden>
    <h1>Moj <span>album</span></h1>
    <p class="sub" id="albumSub"></p>
    <div id="albumBody" style="width:100%"></div>
    <button class="btn primary" id="albumBack" type="button">‹ Nazad na igru</button>
  </section>
</main>

<div class="overlay" id="detail" hidden role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="bigflag" id="dFlag"></div>
    <h2 id="dName"></h2>
    <p id="dFact"></p>
    <button class="btn primary" id="dClose" type="button">Zatvori</button>
  </div>
</div>

<script src="common.js"></script>
<script src="zastave-data.js"></script>
<script>
(function(){
  var D=FlagData,LIST=D.LIST,CONTS=D.CONTINENTS,$=function(id){return document.getElementById(id)};
  document.body.insertAdjacentHTML('afterbegin',D.DEFS);
  var byId={},contById={};
  LIST.forEach(function(x){byId[x.id]=x});
  CONTS.forEach(function(c){contById[c.id]=c});

  var store={learned:{},best:{}};
  try{var s=JSON.parse(localStorage.getItem('tvi-flags')||'null');if(s&&s.learned)store=s;if(!store.best)store.best={}}catch(e){}
  function save(){try{localStorage.setItem('tvi-flags',JSON.stringify(store))}catch(e){}}

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function pick(a,n){return shuffle(a).slice(0,n)}
  function flagHtml(id,label,cls){return D.svg(id,label,cls)}
  var PRAISE=['Bravo!','Tačno!','Super!','Odlično!','Bravo, majstore!'];

  var screens=['start','play','result','album'],cur='start';
  function show(name){
    cur=name;
    screens.forEach(function(s){$(s).hidden=s!==name});
    window.scrollTo(0,0);
  }

  /* ---------- početni ekran ---------- */
  function countFor(mode){
    var pool=mode==='world'?LIST:LIST.filter(function(x){return x.cont===mode});
    var got=pool.filter(function(x){return store.learned[x.id]}).length;
    return [got,pool.length];
  }
  function starsText(n){return n?'★'.repeat(n)+'☆'.repeat(3-n):''}
  function paintStart(){
    var h='';
    var w=countFor('world');
    h+='<button class="cont world" type="button" data-mode="world"><b>🌍 Ceo svet</b><small>Zastave iz svih kontinenata · '+w[0]+' od '+w[1]+' u albumu '+starsText(store.best.world||0)+'</small></button>';
    CONTS.forEach(function(c){
      var n=countFor(c.id);
      h+='<button class="cont" type="button" data-mode="'+c.id+'" style="--c:'+c.color+'"><b>'+c.name+'</b><small>'+n[0]+' od '+n[1]+' zastava '+starsText(store.best[c.id]||0)+'</small></button>';
    });
    $('conts').innerHTML=h;
  }
  $('conts').addEventListener('click',function(e){
    var b=e.target.closest('[data-mode]');if(!b)return;
    startRound(b.dataset.mode);
  });

  /* ---------- pravljenje runde ---------- */
  var round=null;
  function distractors(ans,mode,k){
    var ok=LIST.filter(function(x){return x.id!==ans.id&&!(ans.grp&&x.grp===ans.grp)});
    if(mode==='world'){
      var same=shuffle(ok.filter(function(x){return x.cont===ans.cont})).slice(0,2);
      var rest=shuffle(ok.filter(function(x){return same.indexOf(x)<0}));
      return same.concat(rest).slice(0,k);
    }
    return shuffle(ok.filter(function(x){return x.cont===mode})).slice(0,k);
  }
  function makeRound(mode){
    var pool=mode==='world'?LIST:LIST.filter(function(x){return x.cont===mode});
    var n=Math.min(10,pool.length);
    var items=pool.map(function(x){return {x:x,k:(store.learned[x.id]?1:0)+Math.random()*1.6}})
      .sort(function(a,b){return a.k-b.k}).slice(0,n).map(function(o){return o.x});
    var types=[],i;
    if(mode==='world'){for(i=0;i<n;i++)types.push(i<5?'name':i<8?'flag':'cont')}
    else{for(i=0;i<n;i++)types.push(i<Math.ceil(n*.6)?'name':'flag')}
    types=shuffle(types);
    var qs=items.map(function(it,i){
      var t=types[i];
      if(t==='cont'&&it.amb)t='name';
      var q={item:it,type:t,done:false,first:true,help:false,tries:0};
      if(t==='cont'){
        var others=pick(CONTS.filter(function(c){return c.id!==it.cont}),3);
        q.opts=shuffle([contById[it.cont]].concat(others)).map(function(c){return c.id});
        q.right=it.cont;
      }else{
        q.opts=shuffle([it].concat(distractors(it,mode,3))).map(function(x){return x.id});
        q.right=it.id;
      }
      return q;
    });
    return {mode:mode,qs:qs,i:0,correct:0,newly:[]};
  }
  function startRound(mode){
    round=makeRound(mode);
    show('play');renderQ();
  }

  /* ---------- pitanje ---------- */
  function paintDots(){
    $('dots').innerHTML=round.qs.map(function(q,i){
      var c=i===round.i?'cur':q.done?(q.first?'ok':'miss'):'';
      return '<i class="'+c+'"></i>';
    }).join('');
  }
  function renderQ(){
    var q=round.qs[round.i],it=q.item,h='';
    paintDots();
    $('fb').hidden=true;$('nextBtn').hidden=true;$('helpBtn').hidden=false;$('helpBtn').disabled=false;
    $('opts').classList.remove('done');
    var showFlag=q.type!=='flag';
    $('qflag').hidden=!showFlag;
    if(showFlag)$('qflag').innerHTML=flagHtml(it.id,'Zastava');
    if(q.type==='name')$('prompt').textContent='Čija je ovo zastava?';
    else if(q.type==='cont')$('prompt').textContent='Na kom kontinentu je ova zemlja?';
    else $('prompt').innerHTML='Pronađi zastavu: <b>'+it.name+'</b>';
    q.opts.forEach(function(id,i){
      if(q.type==='flag'){
        h+='<button class="opt flagopt" type="button" data-id="'+id+'" aria-label="Zastava '+(i+1)+'"><span class="fl">'+flagHtml(id,'Zastava')+'</span><span class="cap">'+byId[id].name+'</span></button>';
      }else if(q.type==='cont'){
        var c=contById[id];
        h+='<button class="opt" type="button" data-id="'+id+'" style="--c:'+c.color+'"><span><span class="dot"></span>'+c.name+'</span></button>';
      }else{
        h+='<button class="opt" type="button" data-id="'+id+'">'+byId[id].name+'</button>';
      }
    });
    $('opts').innerHTML=h;
    var first=$('opts').querySelector('.opt');
    if(first)first.focus({preventScroll:true});
  }
  function answer(id,btn){
    var q=round.qs[round.i];
    if(q.done||btn.disabled)return;
    var it=q.item;
    if(id===q.right){
      q.done=true;
      var good=q.first&&!q.help;
      if(good){
        round.correct++;
        if(!store.learned[it.id]){store.learned[it.id]=1;round.newly.push(it.id)}
        save();
      }
      btn.classList.add('good');
      $('opts').classList.add('done');
      [].forEach.call($('opts').querySelectorAll('.opt'),function(o){o.disabled=true});
      $('helpBtn').hidden=true;
      var head=PRAISE[Math.floor(Math.random()*PRAISE.length)];
      var line=q.type==='cont'?it.name+' — '+contById[it.cont].name:q.type==='name'?'Ovo je zastava: '+it.name:'To je zastava: '+it.name;
      $('fb').innerHTML='<span class="big">'+(good?head:'Sad znaš!')+'</span>'+line+'<div class="fact">'+it.fact+'</div>';
      $('fb').hidden=false;
      paintDots();
      var last=round.i===round.qs.length-1;
      $('nextBtn').textContent=last?'Završi ★':'Dalje ›';
      $('nextBtn').hidden=false;$('nextBtn').focus();
      good?Snd.pop():Snd.put();
    }else{
      q.first=false;q.tries++;
      btn.classList.add('bad');btn.disabled=true;
      $('fb').innerHTML='<span class="big">Skoro!</span>Probaj još jednom.';$('fb').hidden=false;
      Snd.soft();
      var nx=$('opts').querySelector('.opt:not(:disabled):not(.gone)');if(nx)nx.focus();
    }
  }
  $('opts').addEventListener('click',function(e){
    var b=e.target.closest('.opt');if(!b)return;
    answer(b.dataset.id,b);
  });
  $('helpBtn').addEventListener('click',function(){
    var q=round.qs[round.i];
    if(q.done)return;
    var live=[].filter.call($('opts').querySelectorAll('.opt'),function(o){return !o.disabled&&!o.classList.contains('gone')});
    var wrong=live.filter(function(o){return o.dataset.id!==q.right});
    pick(wrong,Math.min(2,wrong.length-1)).forEach(function(o){o.classList.add('gone');o.disabled=true});
    q.help=true;$('helpBtn').disabled=true;
    $('fb').innerHTML='<span class="big">Dva odgovora su sklonjena.</span>Izaberi jedan od preostalih.';$('fb').hidden=false;
    var nx=$('opts').querySelector('.opt:not(:disabled)');if(nx)nx.focus();
  });
  $('nextBtn').addEventListener('click',function(){
    if(round.i<round.qs.length-1){round.i++;renderQ()}
    else finish();
  });

  /* ---------- kraj runde ---------- */
  function finish(){
    var n=round.qs.length,acc=round.correct/n;
    var stars=acc>=.9?3:acc>=.6?2:1;
    if(stars>(store.best[round.mode]||0)){store.best[round.mode]=stars;save()}
    $('resTitle').textContent=stars===3?'Neverovatno!':stars===2?'Bravo!':'Dobro je krenulo!';
    $('resStars').innerHTML=[0,1,2].map(function(i){return '<span class="'+(i<stars?'':'off')+'">★</span>'}).join('');
    $('resText').textContent='Iz prvog pokušaja si pogodio '+round.correct+' od '+n+'.'+(stars<3?' Svaki put naučiš još ponešto!':'');
    var nf=round.newly.map(function(id){return '<div class="nf"><span class="fl">'+flagHtml(id,byId[id].name)+'</span>'+byId[id].name+'</div>'}).join('');
    $('newFlags').innerHTML=nf?'<div style="grid-column:1/-1;text-align:center;color:var(--accent);font-weight:800;font-size:18px">Nove zastave u albumu:</div>'+nf:'';
    show('result');
    stars===3?Snd.win():Snd.pop();
    $('againBtn').focus({preventScroll:true});
  }
  $('againBtn').addEventListener('click',function(){startRound(round.mode)});
  $('menuBtn').addEventListener('click',function(){paintStart();show('start');$('conts').querySelector('.cont').focus()});

  /* ---------- album ---------- */
  var albumFrom='start';
  function paintAlbum(){
    var total=countFor('world');
    $('albumSub').textContent='Otkrio si '+total[0]+' od '+total[1]+' zastava. Pogodi zastavu iz prvog pokušaja da je dodaš u album.';
    var h='';
    CONTS.forEach(function(c){
      var pool=LIST.filter(function(x){return x.cont===c.id}),got=pool.filter(function(x){return store.learned[x.id]}).length;
      h+='<div class="album-sec" style="--c:'+c.color+'"><h2><span>'+c.name+'</span><small>'+got+' / '+pool.length+'</small></h2><div class="tiles">';
      pool.forEach(function(x){
        if(store.learned[x.id])h+='<button class="tile" type="button" data-id="'+x.id+'"><span class="fl">'+flagHtml(x.id,x.name)+'</span>'+x.name+'</button>';
        else h+='<div class="tile locked" aria-label="Još nije otkrivena"><span class="q">?</span>&nbsp;</div>';
      });
      h+='</div></div>';
    });
    $('albumBody').innerHTML=h;
  }
  function openAlbum(from){albumFrom=from;paintAlbum();show('album');$('albumBack').focus({preventScroll:true})}
  $('albumBtn').addEventListener('click',function(){openAlbum('start')});
  $('albumBtn2').addEventListener('click',function(){openAlbum('result')});
  $('albumBack').addEventListener('click',function(){
    if(albumFrom==='result'&&round){show('result')}else{paintStart();show('start')}
  });
  $('albumBody').addEventListener('click',function(e){
    var t=e.target.closest('.tile[data-id]');if(!t)return;
    var x=byId[t.dataset.id];
    $('dFlag').innerHTML=flagHtml(x.id,x.name);$('dName').textContent=x.name+' — '+contById[x.cont].name;$('dFact').textContent=x.fact;
    $('detail').hidden=false;$('dClose').focus();
  });
  $('dClose').addEventListener('click',function(){$('detail').hidden=true});

  /* ---------- tastatura i "Nazad" ---------- */
  TV.onBack=function(){
    if(!$('detail').hidden){$('detail').hidden=true;return}
    if(cur==='start')TV.home();
    else{paintStart();show('start')}
  };
  document.addEventListener('keydown',function(e){
    if(cur!=='play'||e.ctrlKey||e.altKey)return;
    if(e.key>='1'&&e.key<='4'){
      var q=round.qs[round.i],btns=$('opts').querySelectorAll('.opt'),b=btns[Number(e.key)-1];
      if(b&&!q.done)answer(b.dataset.id,b);
    }
  });

  paintStart();
  $('conts').querySelector('.cont').focus({preventScroll:true});
  window.__flags={
    get cur(){return cur},get round(){return round},store:store,
    makeRound:makeRound,
    right:function(){return round.qs[round.i].right}
  };
})();
</script>
</body>
</html>
