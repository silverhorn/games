<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zastave new — Putuj po svetu</title>
<link rel="stylesheet" href="common.css">
<style>
  .wrap{width:100%;max-width:800px;display:flex;flex-direction:column;align-items:center;gap:14px}
  h1{margin:0;font-size:clamp(30px,6vw,48px);text-align:center}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);text-align:center;font-size:18px;margin:0}
  [hidden]{display:none!important}

  /* početni ekran */
  .cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
  .cat{
    appearance:none;border:3px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;
    border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;min-height:104px;
    border-left:10px solid var(--c,#fff);transition:transform .1s,background .15s;
  }
  .cat:hover{background:rgba(255,255,255,.2)}
  .cat:active{transform:scale(.97)}
  .cat:focus-visible,.cont:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:5px solid #fff;outline-offset:3px;box-shadow:0 0 0 9px rgba(255,210,74,.55)}
  .cat .ic{font-size:42px;line-height:1;width:54px;text-align:center}
  .cat b{font-size:clamp(20px,3.2vw,26px);display:block}
  .cat small{color:var(--muted);font-size:16px;display:block;line-height:1.3}
  .cat .pg{color:var(--accent);font-weight:800;font-size:15px;margin-top:2px;display:block}

  /* izbor područja */
  .conts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
  .cont{
    appearance:none;border:3px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;
    border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:88px;
    border-left:10px solid var(--c,#fff);transition:transform .1s,background .15s;
  }
  .cont:hover{background:rgba(255,255,255,.2)}
  .cont:active{transform:scale(.97)}
  .cont b{font-size:clamp(20px,3.2vw,26px)}
  .cont small{color:var(--muted);font-size:16px}
  .cont.wide{grid-column:1/-1;--c:#ffd24a}

  /* pitanje */
  .media{width:min(88vw,380px);line-height:0}
  .flagbox{border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.85);background:#dfe7f5}
  .flagbox img,.fl img{width:100%;height:auto;display:block}
  .shapebox{border-radius:18px;background:linear-gradient(180deg,#2f63b8,#1d4690);border:3px solid rgba(255,255,255,.35);padding:10px}
  .shapebox svg{width:100%;height:auto;display:block}
  .shapebox path{fill:#ffd24a;stroke:#fff3c4;stroke-width:.6;stroke-linejoin:round}
  .lmbox{border-radius:18px;overflow:hidden;border:3px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .lmbox svg{width:100%;height:auto;display:block}
  .mapwrap{position:relative;width:min(92vw,640px);line-height:0;border-radius:18px;overflow:hidden;border:3px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .mapwrap svg{width:100%;height:auto;display:block}
  .mapwrap .inset{position:absolute;right:8px;bottom:8px;width:30%;border:2px solid #fff;border-radius:8px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .prompt{font-size:clamp(21px,3.6vw,30px);font-weight:800;text-align:center;margin:0;line-height:1.25}
  .prompt b{color:var(--accent)}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
  .opt{
    appearance:none;border:3px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:800;
    font-size:clamp(19px,3.2vw,25px);min-height:74px;border-radius:20px;cursor:pointer;padding:12px;
    transition:transform .1s,background .15s,border-color .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;line-height:1.2
  }
  .opt:hover:not(:disabled){background:rgba(255,255,255,.22)}
  .opt:active:not(:disabled){transform:scale(.97)}
  .opt.imgopt{padding:8px;min-height:0}
  .opt .fl{width:100%;line-height:0;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.7);background:#dfe7f5}
  .opt .fl.sh{background:linear-gradient(180deg,#2f63b8,#1d4690);padding:6px}
  .opt .fl.sh path{fill:#ffd24a}
  .opt .fl svg{width:100%;height:auto;display:block}
  .opt .cap{font-size:16px;display:none}
  .opts.done .opt .cap{display:block}
  .opt.bad{background:rgba(255,100,100,.28);border-color:#ff8a8a;opacity:.55}
  .opt.good{background:rgba(95,224,138,.35);border-color:var(--ok);opacity:1}
  .opt.gone{visibility:hidden}
  .dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.4)}
  .dots i.cur{border-color:#fff;background:rgba(255,255,255,.55)}
  .dots i.ok{background:var(--ok);border-color:var(--ok)}
  .dots i.miss{background:var(--accent);border-color:var(--accent)}
  .fb{width:100%;background:rgba(255,255,255,.12);border:2px solid var(--line);border-radius:20px;padding:14px 18px;text-align:center;font-size:clamp(18px,2.8vw,22px);line-height:1.4}
  .fb .big{font-size:clamp(22px,3.4vw,28px);font-weight:800;display:block;margin-bottom:4px}
  .fb .fact{color:#dff0ff;margin-top:4px}
  .fb .fact::before{content:"Znaš li? ";font-weight:800;color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .stars{font-size:64px;letter-spacing:8px;color:var(--accent);text-shadow:0 4px 0 rgba(0,0,0,.25)}
  .stars .off{color:rgba(255,255,255,.25)}
  .newflags{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;width:100%}
  .nf{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:14px;text-align:center;font-weight:700}
  .nf .fl{width:100%;line-height:0;border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,.7);background:#dfe7f5}
  .nf .fl svg,.nf .fl img{width:100%;height:auto;display:block}
  .nf .fl.sh{background:#2b56a5;padding:4px}.nf .fl.sh path{fill:#ffd24a}

  /* album */
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .album-sec{width:100%}
  .album-sec h2{margin:10px 0 8px;font-size:22px;border-left:10px solid var(--c);padding-left:10px;display:flex;justify-content:space-between}
  .album-sec h2 small{color:var(--muted);font-weight:700;font-size:16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .tile{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:14px;font-weight:700;cursor:pointer;text-align:center}
  .tile .fl{width:100%;line-height:0;border-radius:8px;overflow:hidden}
  .tile .fl svg,.tile .fl img{width:100%;height:auto;display:block}
  .tile.locked{cursor:default;opacity:.65}
  .tile.locked .q{width:100%;aspect-ratio:3/2;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:rgba(255,255,255,.55)}
  .tile.lmt{grid-column:span 1}
  .bigflag{width:min(80vw,320px);margin:0 auto;border-radius:12px;overflow:hidden;line-height:0;border:3px solid rgba(255,255,255,.85);background:#dfe7f5}
  .bigflag img,.bigflag svg{width:100%;height:auto;display:block}
  .twoup{display:flex;gap:12px;justify-content:center;align-items:center}
  .twoup .shapebox{width:34%;padding:6px}
  @media (max-width:560px){.cats,.conts{grid-template-columns:1fr}.opts{gap:10px}}
</style>
</head>
<body>
<header class="top">
  <button class="btn" id="backBtn" type="button" hidden>‹ Nazad</button>
  <div class="brand">ZASTAVE NEW</div>
  <div class="grow"></div>
  <button class="btn round" id="snd" type="button">🔊</button>
</header>

<main class="page">
  <section class="wrap" id="hub">
    <h1>Putuj po <span>svetu</span></h1>
    <p class="sub">Zastave, gradovi, planine, reke i znamenitosti. Izaberi šta želiš da naučiš.</p>
    <div class="cats" id="cats"></div>
    <button class="btn" id="albumBtn" type="button">📒 Moj album</button>
  </section>

  <section class="wrap" id="modes" hidden>
    <h1 id="modeTitle"></h1>
    <p class="sub" id="modeSub"></p>
    <div class="conts" id="conts"></div>
  </section>

  <section class="wrap" id="play" hidden>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <p class="prompt" id="prompt"></p>
    <div class="media" id="media" hidden></div>
    <div class="opts" id="opts"></div>
    <div class="row"><button class="btn" id="helpBtn" type="button">💡 Pomoć</button></div>
    <div class="fb" id="fb" hidden aria-live="polite"></div>
    <div class="media" id="reveal" hidden></div>
    <button class="btn primary" id="nextBtn" type="button" hidden>Dalje ›</button>
  </section>

  <section class="wrap" id="result" hidden>
    <h1 id="resTitle">Bravo!</h1>
    <div class="stars" id="resStars" aria-hidden="true"></div>
    <p class="sub" id="resText"></p>
    <div class="newflags" id="newFlags"></div>
    <div class="row">
      <button class="btn primary" id="againBtn" type="button">Igraj ponovo</button>
      <button class="btn" id="homeBtn" type="button">Na početak</button>
      <button class="btn" id="albumBtn2" type="button">📒 Album</button>
    </div>
  </section>

  <section class="wrap" id="album" hidden>
    <h1>Moj <span>album</span></h1>
    <p class="sub" id="albumSub"></p>
    <div class="tabs">
      <button class="btn" type="button" data-tab="f" aria-pressed="true">Zastave</button>
      <button class="btn" type="button" data-tab="l" aria-pressed="false">Razglednice</button>
    </div>
    <div id="albumBody" style="width:100%"></div>
    <button class="btn primary" id="albumBack" type="button">‹ Nazad</button>
  </section>
</main>

<div class="overlay" id="detail" hidden role="dialog" aria-modal="true">
  <div class="sheet">
    <div id="dMedia"></div>
    <h2 id="dName"></h2>
    <p id="dFact"></p>
    <button class="btn primary" id="dClose" type="button">Zatvori</button>
  </div>
</div>

<script src="common.js"></script>
<script src="data-content.js"></script>
<script src="data-shapes.js"></script>
<script src="data-borders.js"></script>
<script src="data-world.js"></script>
<script src="data-landmarks.js"></script>
<script src="app.js"></script>
</body>
</html>
